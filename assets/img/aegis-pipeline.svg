    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0;0.320;0.321;0.400;0.401;1" values="0;0;1;1;0;0"/>
  </circle>
  <rect x="394" y="48" width="150" height="84" rx="12" fill="#2f81f7" fill-opacity="0.08"
        stroke="#2f81f7" stroke-width="2" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0.000;0.399;0.400;0.580;1.000" values="0.35;0.35;1;0.35;0.35"/>
  </rect>
  <text x="469.0" y="84" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#2f81f7">30 features</text>
  <text x="469.0" y="108" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12.5" fill="#8b949e">behaviour + cycles</text>
  <line x1="548" y1="90.0" x2="576" y2="90.0" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M575,85.0 L582,90.0 L575,95.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <circle r="4.5" fill="#d29922" opacity="0">
    <animateMotion dur="6.0s" repeatCount="indefinite" calcMode="linear" path="M548,90.0 L582,90.0"
