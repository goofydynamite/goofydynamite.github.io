    <animate attributeName="stroke-opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0.000;0.199;0.200;0.380;1.000" values="0.35;0.35;1;0.35;0.35"/>
  </rect>
  <text x="277.0" y="84" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#2f81f7">Ingest</text>
  <text x="277.0" y="108" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12.5" fill="#8b949e">USD, labels, clean</text>
  <line x1="356" y1="90.0" x2="384" y2="90.0" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M383,85.0 L390,90.0 L383,95.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <circle r="4.5" fill="#d29922" opacity="0">
    <animateMotion dur="6.0s" repeatCount="indefinite" calcMode="linear" path="M356,90.0 L390,90.0"
