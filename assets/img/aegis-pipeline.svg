<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 180" width="938" height="180" role="img">
  <title>Aegis pipeline: payments to ingest, features, LightGBM and alerts</title>
  <rect x="10" y="48" width="150" height="84" rx="12" fill="#2f81f7" fill-opacity="0.08"
        stroke="#2f81f7" stroke-width="2" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0.000;0.180;1.000" values="1;0.35;0.35"/>
  </rect>
  <text x="85.0" y="84" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#2f81f7">6.9M payments</text>
  <text x="85.0" y="108" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12.5" fill="#8b949e">IBM AML dataset</text>
  <line x1="164" y1="90.0" x2="192" y2="90.0" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M191,85.0 L198,90.0 L191,95.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <circle r="4.5" fill="#d29922" opacity="0">
    <animateMotion dur="6.0s" repeatCount="indefinite" calcMode="linear" path="M164,90.0 L198,90.0"
