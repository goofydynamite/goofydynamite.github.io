    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0;0.120;0.121;0.200;0.201;1" values="0;0;1;1;0;0"/>
  </circle>
  <rect x="202" y="48" width="150" height="84" rx="12" fill="#2f81f7" fill-opacity="0.08"
