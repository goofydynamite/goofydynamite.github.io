    <animate attributeName="stroke-opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0.000;0.799;0.800;0.980;1.000" values="0.35;0.35;1;0.35;0.35"/>
  </rect>
  <text x="853.0" y="84" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#2f81f7">Alerts</text>
  <text x="853.0" y="108" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12.5" fill="#8b949e">cases · dashboard · API</text>
