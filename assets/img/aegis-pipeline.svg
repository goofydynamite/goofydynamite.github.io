    <animate attributeName="stroke-opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0.000;0.599;0.600;0.780;1.000" values="0.35;0.35;1;0.35;0.35"/>
  </rect>
  <text x="661.0" y="84" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#2f81f7">LightGBM</text>
  <text x="661.0" y="108" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12.5" fill="#8b949e">+ cycle rule</text>
  <line x1="740" y1="90.0" x2="768" y2="90.0" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M767,85.0 L774,90.0 L767,95.0" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="0.6"/>
  <circle r="4.5" fill="#d29922" opacity="0">
